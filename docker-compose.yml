services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: dunning-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: dunning
      APP_USER_PASSWORD: dunning
    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  oracle_data: